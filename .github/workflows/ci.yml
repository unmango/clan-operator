name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The gate the main ruleset requires. It passes when every job in `needs`
  # passed; add each new job to `needs` so it blocks merges.
  required:
    runs-on: ubuntu-latest
    needs: []
    if: always()
    steps:
      - name: Check needed jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            exit 1
          fi
